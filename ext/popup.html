<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HUB</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../css/tokens.css">
<style>
  /* The popup is small enough to style here rather than give a sheet of its
     own, but every value is a token — it is the same app. */
  html,body{margin:0}
  body{width:268px;padding:16px;background:var(--bg);color:var(--tx);
       font:400 13px/1.5 var(--mono)}
  h1{margin:0 0 14px;font:700 30px/1 var(--head);letter-spacing:-.03em;
     text-transform:uppercase;text-shadow:var(--title-sh-x) 0 0 var(--title-sh-c)}
  h1 em{font-style:normal}

  .state{display:flex;align-items:center;gap:8px;margin:0 0 14px;
         font:500 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--tx-2)}
  .dot{width:7px;height:7px;border-radius:var(--r-pill);background:var(--mu);
       transition:background var(--dur-2) var(--ease)}
  .state.on .dot{background:var(--gr)}
  .state.paused .dot{background:var(--or)}

  .rows{display:flex;flex-direction:column;gap:6px}
  button{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    width:100%;height:34px;padding:0 12px;cursor:pointer;
    background:var(--s1);border:var(--bw) solid var(--bd);border-radius:var(--r1);
    font:500 12px/1 var(--mono);letter-spacing:.04em;color:var(--tx);
    transition:background var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease);
  }
  button:hover{background:var(--s2);border-color:var(--bd-2)}
  button:focus-visible{outline:var(--bw) solid var(--y);outline-offset:2px}
  button.y{background:var(--y);border-color:var(--y);color:var(--on-y);font-weight:700}
  button .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.6}

  p.foot{margin:14px 0 0;font-size:11px;line-height:1.5;color:var(--tx-2)}
  p.foot b{color:var(--tx);font-weight:500}
</style>
</head>
<body>

<h1>HUB<em>.</em></h1>

<div class="state" id="state"><span class="dot"></span><span id="state-t">…</span></div>

<div class="rows">
  <button id="toggle">…</button>
  <button id="snooze">pause 15 min<span class="k">temporary</span></button>
  <button id="board" class="y">open the board</button>
</div>

<p class="foot" id="foot">The board is the way in. Anything else on YouTube gets it put in front of you.</p>

<script src="popup.js"></script>
</body>
</html>
