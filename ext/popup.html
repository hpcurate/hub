<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HUB</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>

<h1>HUB<em>.</em></h1>

<div class="state" id="state"><span class="dot"></span><span id="state-t">…</span></div>

<div class="rows" id="guard-controls">
  <button id="toggle">…</button>
  <button id="snooze">pause 15 min<span class="k">temporary</span></button>
  <button id="addmode">add mode<span class="k" id="addmode-k">off</span></button>

</div>

<div class="popup-nav">
  <button id="board" class="y">open the board</button>
  <button id="today">posted today</button>
  <button id="queue">queue <span id="queue-count"></span></button>
  <button id="settings">settings</button>
  <button id="design">card design</button>
</div>
<section id="popup-fresh">
  <h2 id="fresh-heading">fresh uploads</h2>
  <div id="fresh-list"></div>
  <p class="foot">From the last channel check. Refresh to look for new uploads.</p>
</section>
<details id="popup-actions">
  <summary>quick actions</summary>
  <div class="rows">
    <button id="refresh-info">refresh channel info <span class="k">opens board</span></button>
    <button id="random">open a random channel</button>
    <button id="clear-dots">clear new-video dots</button>
  </div>
</details>
<p id="popup-notice" role="status" aria-live="polite"></p>
<script src="scope.js"></script>
<script src="model.js"></script>
<script src="ig.js"></script>
<script src="../js/store.js"></script>
<script src="popup.js"></script>
</body>
</html>
